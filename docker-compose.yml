
services:
  app:
    restart: always
    image: myapp:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL= jdbc:mysql://db:3306/my_schema
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootroot
    depends_on:
      - db


  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: my_schema
    ports:
      - "3306:3306"
